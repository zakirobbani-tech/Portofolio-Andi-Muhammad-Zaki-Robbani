  <script>
  addEventListener('DOMContentLoaded',()=>{
  const $=i=>document.getElementById(i),D=DATA;
  const I=k=>(typeof IMG!=='undefined'&&IMG[k])||k||'';const cv=p=>I(p.img||(p.gallery||[])[0]||'');
  const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.title=D.name+" — Portfolio";
  $('lg').innerHTML=`${E(D.nick)}<i>.</i>`;$('nm').textContent=D.nick;$('bio').textContent=D.bio;$('bio2').textContent=D.bio2;
  $('av').innerHTML=D.photo?`<img src="${I(D.photo)}" alt="${E(D.name)}">`:E(D.nick[0].toUpperCase());if(D.photo)$('av').classList.add('ph');
  const A0=D.achievements[0];$('b1').innerHTML=A0?`<span>${A0.icon}</span><div><b>${E(A0.title.split('—')[0])}</b><small>${E(A0.place)}</small></div>`:'';
  $('b2').innerHTML=`<span>🎮</span><div><b>${E(D.roles[0])}</b><small>${E(D.education.school)}</small></div>`;
  $('sts').innerHTML=D.stats.map(s=>`<div class="st"><b data-n="${s[0]}">0</b><span>${E(s[1])}</span></div>`).join('');
  $('mq').innerHTML=[...D.skills.map(s=>s[0]),...D.tools.map(t=>t[0])].concat([...D.skills.map(s=>s[0]),...D.tools.map(t=>t[0])]).map(t=>`<span>${E(t)}</span>`).join('');

  $('sk').innerHTML=D.skills.map(s=>`<span class="skill-chip">${E(s)}</span>`).join('');
  $('tools').innerHTML='';
  $('tl').innerHTML=D.experience.map(e=>`<div class="cd q rv">${e.logo?`<img class="lg2" src="${I(e.logo)}" alt="">`:''}<small>${E(e.date)}</small><h3>${E(e.title)}</h3><p><b>${E(e.place)}</b>${e.desc?" — "+E(e.desc):""}</p></div>`).join('');
  $('ct').innerHTML=D.contact.map(c=>`<div class="cd rv"><a href="${E(c[3])}" target="_blank" rel="noopener"><span class="ic">${c[0]}</span><span><small>${E(c[1])}</small><b>${E(c[2])}</b></span></a></div>`).join('');
  $('ft').innerHTML=`© 2026 ${E(D.name)}. Terima kasih sudah berkunjung.`;
  /* projects */
  const cats=["Semua",...new Set(D.projects.map(p=>p.cat))];
  $('tab').innerHTML=cats.map((c,i)=>`<button class="${i?'':'on'}" data-c="${E(c)}">${E(c)}</button>`).join('');
  function dp(c){$('pj').innerHTML=D.projects.map((p,i)=>[p,i]).filter(([p])=>c=="Semua"||p.cat==c).map(([p,i])=>`<div class="cd pj rv in" data-i="${i}"><div class="pt">${cv(p)?`<img src="${cv(p)}" alt="">`:p.icon}</div><div class="pb"><span class="tg">${E(p.cat)}</span><h3>${E(p.title)}</h3><p>${E(p.desc.slice(0,90))}…</p></div></div>`).join('')}

  $('tab').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('tab').children].forEach(x=>x.classList.toggle('on',x==b));dp(b.dataset.c)};
  $('pj').onclick=e=>{const c=e.target.closest('.pj');if(!c)return;const p=D.projects[c.dataset.i];
  $('mb').innerHTML=`<div class="pt" style="height:220px">${cv(p)?`<img src="${cv(p)}" alt="">`:p.icon}</div><div class="pb"><button class="x" id="xx">✕</button><span class="tg">${E(p.cat)}${p.tools?" · "+E(p.tools):""}</span><h3>${E(p.title)}</h3><p>${E(p.desc)}</p></div>${(p.gallery||[]).length>1?`<div class="gl">${p.gallery.slice(1).map(g=>`<img src="${I(g)}" alt="" loading="lazy">`).join('')}</div>`:''}`;
  $('md').classList.add('on');$('xx').onclick=()=>$('md').classList.remove('on')};
  $('mb').addEventListener('click',e=>{if(e.target.tagName=='IMG'){$('lbi').src=e.target.src;$('lbx').classList.add('on')}});$('lbx').onclick=()=>$('lbx').classList.remove('on');
  $('md').onclick=e=>{if(e.target==$('md'))$('md').classList.remove('on')};
  addEventListener('keydown',e=>e.key=='Escape'&&($('lbx').classList.contains('on')?$('lbx').classList.remove('on'):$('md').classList.remove('on')));
  /* theme */
  try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
  $('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('th',r.dataset.theme)}catch(e){}};
  /* typing */
  let ri=0,ci=0,del=0;(function t(){const w=D.roles[ri];ci+=del?-1:1;$('ty').textContent=w.slice(0,ci);let s=del?35:70;
  if(!del&&ci==w.length){del=1;s=1400}else if(del&&ci==0){del=0;ri=(ri+1)%D.roles.length;s=300}setTimeout(t,s)})();
  /* scroll progress, reveal, counters, bars */
  addEventListener('scroll',()=>{$('pg').style.width=scrollY/(document.documentElement.scrollHeight-innerHeight)*100+'%'},{passive:true});
  function cnt(el){const n=+el.dataset.n;let v=0;const s=setInterval(()=>{v++;el.textContent=v;if(v>=n)clearInterval(s)},Math.max(40,900/n))}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');
  e.target.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');
  e.target.querySelectorAll('[data-n]').forEach(cnt);io.unobserve(e.target)}),{threshold:.12});
  document.querySelectorAll('.rv,.sts').forEach(e=>io.observe(e));
  });
